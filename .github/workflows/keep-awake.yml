# Opens the server's /health page every 5 minutes so Render's free plan never puts it to sleep.
# A sleeping server has no timer, so no sheet is read while it sleeps.
# Not needed on an always-on (paid) Render instance: delete this file then.
name: keep-awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Open /health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 https://elite-leads.onrender.com/health
